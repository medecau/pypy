name: CPython Stdlib Tests

on:
  workflow_run:
    workflows: ["Translate PyPy"]
    types: [completed]
    branches: ["main", "py3.*"]
  workflow_dispatch:
    inputs:
      smoke_only:
        description: 'Only run smoke tests (~60 modules)'
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  stdlib-tests:
    name: stdlib tests
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      SMOKE_ONLY_INPUT: ${{ github.event.inputs.smoke_only }}
      EVENT_NAME: ${{ github.event_name }}
      WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}

    steps:
    - uses: actions/checkout@v4

    - name: Download PyPy artifact (workflow_run)
      if: github.event_name == 'workflow_run'
      uses: actions/download-artifact@v4
      with:
        name: pypy-ci-build-ubuntu-24.04
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: ${{ github.event.workflow_run.id }}

    - name: Download PyPy artifact (workflow_dispatch)
      if: github.event_name == 'workflow_dispatch'
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: translate.yml
        name: pypy-ci-build-ubuntu-24.04
        search_artifacts: true

    - name: Extract PyPy
      run: |
        tar xjf pypy-nightly.tar.bz2
        PYPY_DIR=$(find . -maxdepth 1 -name 'pypy-nightly' -type d | head -1)
        PYPY_BIN=$(find "$PYPY_DIR" -name 'pypy*' -type f -executable | grep -v '\.debug' | head -1)
        PYPY_BIN=$(realpath "$PYPY_BIN")
        chmod +x "$PYPY_BIN"
        echo "PYPY_BIN=$PYPY_BIN" >> "$GITHUB_ENV"
        echo "Found PyPy binary: $PYPY_BIN"
        "$PYPY_BIN" --version

    - name: Install system dependencies
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: libffi-dev pkg-config zlib1g-dev libbz2-dev libsqlite3-dev libncurses5-dev libexpat1-dev libssl-dev libgdbm-dev tk-dev libgc-dev liblzma-dev libncursesw5-dev
        version: 1.0

    - name: Run stdlib tests
      working-directory: pypy/tool/ci
      run: |
        SMOKE_FLAG=""
        if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$SMOKE_ONLY_INPUT" = "true" ]; then
          SMOKE_FLAG="--smoke-only"
        elif [ "$EVENT_NAME" = "workflow_run" ]; then
          SMOKE_FLAG="--smoke-only"
        fi
        python3 run_stdlib_tests.py --pypy "$PYPY_BIN" $SMOKE_FLAG --timeout 300

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: stdlib-test-results
        path: pypy/tool/ci/stdlib-results.json
        if-no-files-found: ignore
