name: CPython Stdlib Tests

on:
  workflow_run:
    workflows: ["Translate PyPy"]
    types: [completed]
    branches: ["main", "py3.*"]
  workflow_dispatch:
    inputs:
      smoke_only:
        description: 'Only run smoke tests (~60 modules)'
        type: boolean
        default: false

concurrency:
  group: stdlib-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  stdlib-linux:
    name: stdlib (ubuntu-24.04)
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      SMOKE_ONLY_INPUT: ${{ github.event.inputs.smoke_only }}
      EVENT_NAME: ${{ github.event_name }}
      WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}

    steps:
    - uses: actions/checkout@v4

    - name: Download PyPy artifact (workflow_run)
      if: github.event_name == 'workflow_run'
      uses: actions/download-artifact@v4
      with:
        name: pypy-ci-build-ubuntu-24.04
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: ${{ github.event.workflow_run.id }}

    - name: Download PyPy artifact (workflow_dispatch)
      if: github.event_name == 'workflow_dispatch'
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: translate.yml
        name: pypy-ci-build-ubuntu-24.04
        search_artifacts: true

    - name: Extract PyPy
      run: |
        tar xjf pypy-nightly.tar.bz2
        PYPY_DIR=$(find . -maxdepth 1 -name 'pypy-nightly' -type d | head -1)
        PYPY_BIN=$(find "$PYPY_DIR" -name 'pypy*' -type f -executable | grep -v '\.debug' | head -1)
        PYPY_BIN=$(realpath "$PYPY_BIN")
        chmod +x "$PYPY_BIN"
        echo "PYPY_BIN=$PYPY_BIN" >> "$GITHUB_ENV"
        "$PYPY_BIN" --version

    - name: Install system dependencies
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: libffi-dev pkg-config zlib1g-dev libbz2-dev libsqlite3-dev libncurses5-dev libexpat1-dev libssl-dev libgdbm-dev tk-dev libgc-dev liblzma-dev libncursesw5-dev
        version: 1.0

    - name: Run smoke tests (gate)
      working-directory: pypy/tool/ci
      run: python3 run_stdlib_tests.py --pypy "$PYPY_BIN" --smoke-only --timeout 300

    - name: Upload smoke results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: stdlib-smoke-results-ubuntu-24.04
        path: pypy/tool/ci/stdlib-results.json
        if-no-files-found: ignore

    - name: Run full stdlib tests
      if: success() && github.event.inputs.smoke_only != 'true'
      working-directory: pypy/tool/ci
      run: python3 run_stdlib_tests.py --pypy "$PYPY_BIN" --timeout 300

    - name: Upload full results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: stdlib-full-results-ubuntu-24.04
        path: pypy/tool/ci/stdlib-results.json
        if-no-files-found: ignore

  stdlib-macos:
    name: stdlib (macos-14)
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: macos-14
    timeout-minutes: 180
    # Only run if macOS artifact was built (manual trigger with include_macos or tags)
    continue-on-error: true

    env:
      SMOKE_ONLY_INPUT: ${{ github.event.inputs.smoke_only }}
      EVENT_NAME: ${{ github.event_name }}
      WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}

    steps:
    - uses: actions/checkout@v4

    - name: Download PyPy artifact (workflow_run)
      id: download-wr
      if: github.event_name == 'workflow_run'
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: pypy-ci-build-macos-14
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: ${{ github.event.workflow_run.id }}

    - name: Download PyPy artifact (workflow_dispatch)
      id: download-wd
      if: github.event_name == 'workflow_dispatch'
      continue-on-error: true
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: translate.yml
        name: pypy-ci-build-macos-14
        search_artifacts: true

    - name: Skip if no macOS artifact
      if: steps.download-wr.outcome == 'failure' || steps.download-wd.outcome == 'failure'
      run: |
        echo "No macOS artifact available, skipping"
        exit 0

    - name: Extract PyPy
      if: steps.download-wr.outcome != 'failure' && steps.download-wd.outcome != 'failure'
      run: |
        tar xjf pypy-nightly.tar.bz2
        PYPY_DIR=$(find . -maxdepth 1 -name 'pypy-nightly' -type d | head -1)
        PYPY_BIN=$(find "$PYPY_DIR" -name 'pypy*' -type f -perm +111 | grep -v '\.debug' | head -1)
        PYPY_BIN=$(realpath "$PYPY_BIN")
        chmod +x "$PYPY_BIN"
        echo "PYPY_BIN=$PYPY_BIN" >> "$GITHUB_ENV"
        "$PYPY_BIN" --version

    - name: Install system dependencies
      if: env.PYPY_BIN != ''
      run: brew install openssl@3 gdbm xz

    - name: Run smoke tests (gate)
      if: env.PYPY_BIN != ''
      working-directory: pypy/tool/ci
      run: python3 run_stdlib_tests.py --pypy "$PYPY_BIN" --smoke-only --timeout 300

    - name: Run full stdlib tests
      if: env.PYPY_BIN != '' && success() && github.event.inputs.smoke_only != 'true'
      working-directory: pypy/tool/ci
      run: python3 run_stdlib_tests.py --pypy "$PYPY_BIN" --timeout 300

    - name: Upload full results
      if: always() && env.PYPY_BIN != ''
      uses: actions/upload-artifact@v4
      with:
        name: stdlib-full-results-macos-14
        path: pypy/tool/ci/stdlib-results.json
        if-no-files-found: ignore
